# XcodeGen builds the .xcodeproj from this file.
#
# A checked-in .xcodeproj is thousands of lines of generated XML that nobody
# can read and everybody breaks. This is the project: two targets, one shared
# file, and the settings that matter. Regenerate with `xcodegen generate`.
name: Shavtzak
options:
  bundleIdPrefix: com.shavtzak
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: he

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    # Automatic signing plus an App Store Connect API key means the build server
    # never holds a .p12 or a provisioning profile. Xcode makes what it needs at
    # archive time and throws it away.
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    # ---- the one line you must change ----
    # Where the app lives: the same address you open in a browser, no slash on
    # the end. Every target reads it, so it is set here once.
    SH_ORIGIN: https://shavtzak.YOUR-SUBDOMAIN.workers.dev

targets:
  Shavtzak:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - target: ShavtzakWidget
        embed: true
      - target: ShavtzakNotify
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shavtzak.app
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ShavtzakWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shavtzak.app.widget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # Rewrites each notification just before it appears, so Apple only ever
  # carries a placeholder. See NotificationService.swift.
  ShavtzakNotify:
    type: app-extension
    platform: iOS
    sources:
      - path: Notify
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shavtzak.app.notify
        INFOPLIST_FILE: Notify/Info.plist
        CODE_SIGN_ENTITLEMENTS: Notify/Notify.entitlements

schemes:
  Shavtzak:
    build:
      targets:
        Shavtzak: all
    archive:
      config: Release
    run:
      config: Debug
