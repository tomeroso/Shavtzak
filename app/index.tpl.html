<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="שבצ״ק">
<title>שבצ״ק</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root{--bg:#0b0f14;--card:#141c25;--card2:#1b2531;--line:#25313f;--fg:#e8eef5;--dim:#8a9bad;
 --acc:#2dd4bf;--on:#ff5b4e;--soon:#ffae2e;--free:#34d399}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Hebrew","Heebo",Arial,sans-serif;
 font-size:16px;line-height:1.45;min-height:100dvh;
 padding:max(10px,env(safe-area-inset-top)) 14px max(20px,env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
#view{max-width:520px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit}
.setup{padding:5vh 2px 0}
.logo{font-size:34px;font-weight:800;letter-spacing:-.5px}
.logo.sm{font-size:25px;margin-bottom:2px}
.sub{color:var(--dim);margin:6px 0 20px;font-size:15px}
.fine{color:var(--dim);font-size:13px;margin-top:16px;line-height:1.6}
.inp{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;color:var(--fg);outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--acc)}
.inp.big{font-size:20px;padding:16px;text-align:center}
.btn{width:100%;margin-top:10px;padding:14px;border-radius:14px;font-weight:600;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--acc);color:#04231f}
.btn.ghost{background:var(--card);border:1px solid var(--line)}
.btn.sm{width:auto;padding:10px 16px;margin:0}
.err{background:#3a1517;border:1px solid #6b2427;color:#ffb4ae;padding:11px 13px;border-radius:12px;margin-bottom:14px;font-size:14px}
.help{margin-top:20px;color:var(--dim);font-size:14px}
.help summary{cursor:pointer;padding:8px 0}
.results{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.res{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 15px;text-align:start}
.res:active{background:var(--card2)}
.res.exact{border-color:var(--acc)}
.res.add{border-style:dashed}
.asname{font-size:12px;color:var(--dim);font-weight:500;margin-inline-start:6px}
.rn{font-weight:600;display:flex;flex-direction:column}
.alias{font-weight:400;font-size:12px;color:var(--dim)}
.rc{color:var(--dim);font-size:13px;white-space:nowrap}
.none{color:var(--dim);text-align:center;padding:18px}
.none.sm{padding:6px;font-size:13px}
.meta{color:var(--dim);font-size:12.5px;text-align:center;margin-top:18px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 2px 12px}
.who{display:flex;align-items:center;gap:6px;font-size:19px;font-weight:700}
.chev{color:var(--dim);font-size:14px}
.tools{display:flex;gap:6px}
.icon{width:38px;height:38px;border-radius:11px;background:var(--card);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:var(--dim)}
.icon:active{background:var(--card2);color:var(--fg)}
.viewing{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:8px 12px;font-size:13.5px;color:var(--dim);margin-bottom:10px}
.link{color:var(--acc);text-decoration:underline;padding:0;font-size:inherit}
.link.danger{color:#ff8b80;display:block;margin:18px auto 0;font-size:13px}
.banner{background:#1e2a1f;border:1px solid #2f5b39;border-radius:14px;padding:12px 14px;margin-bottom:12px}
.banner .bt{font-weight:600;font-size:14.5px}
.banner .bl{color:var(--dim);font-size:13px;margin:6px 0 8px;line-height:1.7}
.hero{border-radius:22px;padding:22px 20px;border:1px solid var(--line);background:var(--card);position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;opacity:.16;pointer-events:none}
.hero.on:before{background:radial-gradient(120% 90% at 80% 0%,var(--on),transparent 70%)}
.hero.soon:before{background:radial-gradient(120% 90% at 80% 0%,var(--soon),transparent 70%)}
.hero.free:before{background:radial-gradient(120% 90% at 80% 0%,var(--free),transparent 70%)}
.hero.on{border-color:#5a2b28}.hero.soon{border-color:#5a4620}.hero.free{border-color:#1f4a3c}
.tag{font-size:13px;font-weight:700;position:relative}
.hero.on .tag{color:var(--on)}.hero.soon .tag{color:var(--soon)}
.hero.free .tag,.hero.none .tag{color:var(--free)}
.big{font-size:46px;font-weight:800;letter-spacing:-1.5px;margin:2px 0;font-variant-numeric:tabular-nums;position:relative}
.unit{font-size:15px;font-weight:600;color:var(--dim);letter-spacing:0;margin-inline-start:8px;vertical-align:5px}
.lead{font-size:16px;opacity:.9;position:relative}
.sub2{font-size:13.5px;color:var(--dim);margin-top:2px;position:relative}
.bar{height:5px;background:#0006;border-radius:99px;margin:14px 0 4px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--on);border-radius:99px;transition:width 1s linear}
.hero .row{display:flex;gap:8px;font-size:14px;margin-top:8px;position:relative}
.hero .k{color:var(--dim);min-width:80px}
.sect{font-size:13px;color:var(--dim);margin:24px 2px 8px;font-weight:600}
/* a settings menu: one tap per topic, instead of one endless page */
.menu{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.mrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
 border-radius:14px;padding:14px 15px;text-align:start;width:100%}
.mrow:active{background:var(--card2)}
.mrow .mi{font-size:19px;width:24px;text-align:center;flex:none}
.mrow .mt{flex:1;min-width:0}
.mrow .mt b{display:block;font-weight:600;font-size:15px}
.mrow .mt small{color:var(--dim);font-size:12.5px;display:block;line-height:1.5}
.mrow .mc{color:var(--dim);font-size:19px;flex:none}
.mrow.hot{border-color:var(--acc)}
.list{display:flex;flex-direction:column;gap:6px}
.daysep{font-size:12.5px;color:var(--dim);margin:12px 2px 2px}
.item{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 15px}
.item .t{font-variant-numeric:tabular-nums;font-weight:700;font-size:17px;white-space:nowrap}
.item .to{color:var(--dim);font-weight:500;font-size:13px}
.item .i{flex:1;display:flex;justify-content:space-between;align-items:center;gap:10px;min-width:0}
.item .p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .w{color:var(--dim);font-size:12.5px;white-space:nowrap}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--dim);font-size:12.5px;margin:26px 2px 6px;padding-top:14px;border-top:1px solid var(--line)}
.sheetbar{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.stab{white-space:nowrap;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:13.5px;color:var(--dim)}
.stab.on{border-color:var(--acc);color:var(--fg);font-weight:600}
.item.live{border-color:var(--on)}
.rule{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rule:last-of-type{border-bottom:0}
.rname{flex:1;min-width:90px;font-size:14px;font-weight:600}
.sel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--fg);font-size:13px}
.times{display:flex;gap:5px}
.tin{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 8px;color:var(--fg);font-size:13px;color-scheme:dark}
@media(prefers-color-scheme:light){.tin{color-scheme:light}}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tb{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:14px;color:var(--dim)}
.tb.on{border-color:var(--acc);color:var(--fg);font-weight:600}
.rank{min-width:26px;text-align:center;font-weight:800;font-size:16px;color:var(--dim);font-variant-numeric:tabular-nums}
.rank.top{color:var(--acc)}
.item.lb{cursor:pointer}
.item.lb.me{border-color:var(--acc)}
.lblrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.steps{padding-inline-start:20px;line-height:2;font-size:14.5px;color:var(--fg)}
.steps li{margin:4px 0}
.ta.big2{height:150px;font-family:inherit;font-size:14px;direction:rtl}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.sel.wide{width:100%}
.warnbox{background:#3a2f15;border:1px solid #6b5424;color:#ffd79a;padding:10px 12px;border-radius:12px;margin-top:10px;font-size:13.5px;line-height:1.7}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.gen{border-collapse:collapse;font-size:12px;white-space:nowrap;width:100%}
table.gen th,table.gen td{border-bottom:1px solid var(--line);border-inline-start:1px solid var(--line);padding:6px 8px;text-align:start}
table.gen th{background:var(--card2);font-weight:700;position:sticky;top:0}
@media(prefers-color-scheme:light){.warnbox{background:#fdf3dc;border-color:#e5c98a;color:#6b4e12}}
/* ---- שבצ״ק editor ---- */
.edbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.edbar .grow{flex:1;min-width:0;font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.daystrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px;-webkit-overflow-scrolling:touch}
.daystrip::-webkit-scrollbar{display:none}
.dchip{white-space:nowrap;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 13px;font-size:13px;color:var(--dim)}
.dchip.on{border-color:var(--acc);color:var(--fg);font-weight:700}
.dchip.bad{border-color:var(--on)}
table.ed{border-collapse:collapse;width:100%;font-size:12.5px}
table.ed th,table.ed td{border-bottom:1px solid var(--line);border-inline-start:1px solid var(--line);padding:5px;text-align:start;vertical-align:top}
table.ed th{background:var(--card2);font-weight:700;font-size:11.5px;white-space:nowrap;position:sticky;top:0;z-index:1}
table.ed td.hh{white-space:nowrap;color:var(--dim);font-variant-numeric:tabular-nums;font-size:11.5px;background:var(--card2)}
table.ed tr.night td.hh{color:var(--soon)}
.pc{display:flex;flex-wrap:wrap;gap:4px;min-width:74px}
.nm{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:5px 8px;font-size:12.5px;color:var(--fg);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:start}
.nm.sel{border-color:var(--acc);background:#0f2f2b;color:var(--fg);font-weight:700}
.nm.warn{border-color:var(--on)}
.nm.me{box-shadow:inset 0 0 0 1px var(--acc)}
.add{border:1px dashed var(--line);border-radius:9px;padding:5px 9px;font-size:12.5px;color:var(--dim);background:transparent}
.add.want{border-color:var(--on);color:var(--on)}
.selbar{position:sticky;bottom:0;background:var(--card);border:1px solid var(--acc);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap;z-index:3}
.selbar .who{flex:1;font-weight:700;min-width:100px}
.savebar{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 0 4px;background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:4}
.savebar .btn{margin-top:0}
.issue{font-size:12.5px;color:var(--dim);padding:5px 0;border-bottom:1px solid var(--line);line-height:1.5}
.issue b{color:var(--on);font-weight:700}
.prow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.prow .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .cnt{color:var(--dim);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pickwrap{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:50}
.picksheet{background:var(--bg);border-top-left-radius:20px;border-top-right-radius:20px;width:100%;max-height:80vh;overflow-y:auto;padding:16px 16px 24px;border-top:1px solid var(--line)}
@media(prefers-color-scheme:light){.nm.sel{background:#d8f5f0}.pickwrap{background:rgba(0,0,0,.35)}}

.item.board.dim{opacity:.5}
.item.contact{text-decoration:none;color:inherit}
.rule .carry{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--dim);white-space:nowrap}
.rule .carry input{accent-color:var(--acc)}
.banner.msg{border-color:var(--acc)}
.item.evt{border-color:var(--acc)}
.item.evt .p{color:var(--acc)}
.item.evt.mine{border-color:var(--soon)}
.item.evt.mine .p{color:var(--soon)}
.banner.msg .bt{color:var(--acc)}
.dpost{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 11px;margin-bottom:8px}
.dseg{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-top:1px solid var(--line)}
.dseg:first-of-type{border-top:0}
.dseg .times2{flex-direction:column;gap:3px;flex:none}
.dseg .tin{width:78px;font-size:12px;padding:5px 6px}
.dcell{flex:1;min-width:0}
.guide{font-size:14.5px;line-height:1.75;color:var(--fg)}
.guide p{margin:8px 0}
.guide b{font-weight:700}
.guide i{color:var(--dim);font-style:normal;text-decoration:underline}
.dot{display:inline-block;width:10px;height:10px;border-radius:99px;vertical-align:1px;margin-inline-end:3px}
.dot.on{background:var(--on)}.dot.soon{background:var(--soon)}.dot.free{background:var(--free)}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:9px}
.phead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.prow2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.times2{display:flex;gap:5px}
.mini{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--dim);white-space:nowrap}
.mini .tin{width:62px}
.opt{display:flex;align-items:flex-start;gap:7px;margin-top:8px;font-size:13px;color:var(--dim);line-height:1.45}
.opt input{margin-top:2px;accent-color:var(--acc);flex:none}
.fromwrap{margin-top:8px;padding-inline-start:24px}
.fromwrap .chips{margin:6px 0}
.nm.auto{opacity:.85;border-style:dashed}
.add.auto{border-style:dotted;opacity:.5}
.item.staff{cursor:pointer}
.item.staff .tel,.item.contact .tel{width:fit-content;max-width:100%}
.item.staff .onnow{color:var(--on)}
.tel{display:inline-block;margin-inline-start:6px;font-variant-numeric:tabular-nums;letter-spacing:.2px;
 color:var(--fg);background:var(--card2);border:1px solid var(--line);border-radius:7px;padding:1px 6px;font-size:12.5px;
 -webkit-user-select:text;user-select:text;cursor:text}
.acts2{display:flex;gap:6px;align-items:center}
.acts2 .icon{width:34px;height:34px}
.callin{display:inline-flex;align-items:center;vertical-align:-4px;margin-inline-start:4px;color:var(--acc);padding:2px 4px;border-radius:8px}
.callin:active{background:var(--card2)}
.item.contact:active{background:var(--card2)}
.item.contact .rc{color:var(--acc)}
.ctc{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.ctc input{flex:1;min-width:0}

.openon{background:#1e2a1f;border:1px solid #2f5b39;border-radius:12px;padding:10px 13px;font-size:14px;font-weight:600;margin-bottom:8px}
@media(prefers-color-scheme:light){.openon{background:#eaf7ee;border-color:#a9dcb8;color:#14532d}}
.tagsm{font-size:10.5px;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:1px 7px;margin-inline-start:5px;vertical-align:2px;color:var(--dim)}
.tagsm.own{border-color:var(--acc);color:var(--acc)}
.acts{display:flex;flex-direction:column;gap:5px;align-items:flex-end;white-space:nowrap}
.badge{background:var(--on);color:#fff;border-radius:99px;font-size:11px;padding:1px 6px;margin-inline-start:6px;font-weight:700}
.invrow{font-family:ui-monospace,monospace;font-size:11.5px;background:var(--card);border:1px solid var(--line);
 border-radius:9px;padding:8px 10px;margin:5px 0;overflow-x:auto;white-space:nowrap}
.dimmer{color:var(--dim);font-size:11.5px}
.warn{color:#ffae2e}
.link.sm{font-size:12.5px;margin:0;display:inline}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin-top:8px}
.crow{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.crow:last-child{border-bottom:0}
.crow span{color:var(--dim)}
.note{color:var(--dim);font-size:13.5px;line-height:1.7;margin:4px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px}
.chip.on{border-color:var(--acc);color:var(--acc);font-weight:600}
.item.board{cursor:pointer}
.item.board.empty{border-color:#5a4620}
.inline{display:flex;gap:8px;align-items:center}
.inline .inp{flex:1}
.code{font-size:28px;font-weight:800;letter-spacing:4px;text-align:center;background:var(--card);border:1px solid var(--acc);border-radius:14px;padding:16px;margin-top:10px;font-variant-numeric:tabular-nums}
.updbar{position:fixed;inset-inline:0;bottom:0;background:var(--acc);color:#04231f;
 padding:10px 14px calc(10px + env(safe-area-inset-bottom));font-size:14px;font-weight:600;text-align:center;z-index:30}
.updbar button{background:#04231f;color:#fff;border-radius:9px;padding:5px 14px;margin-inline-start:10px;font-size:13px;font-weight:700}
.toast{position:fixed;inset-inline:14px;bottom:calc(18px + env(safe-area-inset-bottom));background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:12px 15px;font-size:14px;text-align:center;opacity:0;transform:translateY(12px);transition:.22s;pointer-events:none;z-index:9;max-width:492px;margin:0 auto}
.toast.show{opacity:1;transform:none}
@media(prefers-color-scheme:light){
 :root{--bg:#f5f7fa;--card:#fff;--card2:#eef2f7;--line:#dde4ec;--fg:#0e1720;--dim:#64748b}
 .btn.primary{background:#0f9e8e;color:#fff}
 .hero.on{border-color:#f7b7b1}.hero.soon{border-color:#f5d79a}.hero.free{border-color:#a7e6cf}
 .bar{background:#0001}.banner{background:#eaf7ee;border-color:#a9dcb8}
}
</style>
</head>
<body>
<div id="view"></div>
<noscript><div style="padding:20px">צריך להפעיל JavaScript.</div></noscript>
<script>
/* Safety net: registered before anything else, so a parse error or a failed
   load shows something instead of a blank page. Cleared once the app boots. */
(function () {
  var shown = false;
  function show(what, where) {
    if (shown) return; shown = true;
    var v = document.getElementById('view');
    if (!v) return;
    v.innerHTML = '<div class="setup"><div class="logo">שבצ״ק</div>' +
      '<div class="err">האפליקציה לא נטענה<br><small>' + where + '</small>' +
      '<details><summary>פרטים</summary><pre dir="ltr" style="white-space:pre-wrap">' +
      String(what).replace(/[&<]/g, function (c) { return c === '&' ? '&amp;' : '&lt;'; }) +
      '</pre></details></div>' +
      '<button class="btn ghost" onclick="location.reload(true)">נסה שוב</button>' +
      '<button class="btn ghost" id="nuke">נקה מטמון ואתחל</button></div>';
    var n = document.getElementById('nuke');
    if (n) n.onclick = function () {
      if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
      if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
      try { localStorage.clear(); } catch (e) { }
      setTimeout(function () { location.replace(location.pathname); }, 400);
    };
  }
  window.addEventListener('error', function (e) {
    show((e.error && e.error.stack) || e.message || 'שגיאה', (e.filename || '') + ':' + (e.lineno || ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    show((e.reason && (e.reason.stack || e.reason.message)) || e.reason, 'promise');
  });
  window.__shBooted = function () { shown = true; };   // app came up; stop nagging
  setTimeout(function () {
    if (!document.getElementById('view').children.length) show('הסקריפט לא רץ תוך 6 שניות', 'timeout');
  }, 6000);
})();
