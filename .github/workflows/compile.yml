name: Compile check

# Does it build at all? No signing, no secrets, no accounts, no uploads.
#
# This exists because the first compile of a new app always finds something —
# a library version, a resource name, a Gradle plugin that disagrees with the
# Kotlin one — and there is no reason to spend ten minutes of signing setup to
# hear about it. Runs on every push, and can be run by hand.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # Playwright is only for the browser suites, which need the exported
      # sheets and so do not run here. Skip its 100 MB of browsers.
      - run: npm install --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm test
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      # A debug build needs no keystore and no google-services.json. Firebase
      # is compiled in either way, it just never has anything to talk to.
      - name: Compile
        working-directory: android
        run: gradle --no-daemon -PSH_ORIGIN=https://example.com assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: shavtzak-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  ios:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate
      # Built for the simulator with signing switched off, so no team, no
      # certificate and no App Store Connect key are needed to find out whether
      # the Swift is right.
      - name: Compile
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Shavtzak.xcodeproj \
            -scheme Shavtzak \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
